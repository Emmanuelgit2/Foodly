<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodly - Descubre los mejores sabores</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <!-- Vista 1: Login / Autenticación -->
  <div id="pantalla-login" class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-brand center">
          <span class="brand-icon">🍽️</span>
          <span class="brand-name">Foodly</span>
        </div>
        <p>Ingresa a tu cuenta para explorar los mejores restaurantes</p>
      </div>

      <form id="form-login" onsubmit="procesarLogin(event)">
        <div class="input-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" placeholder="usuario@ejemplo.com" required>
        </div>

        <div class="input-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>

        <div class="captcha-box">
          <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
        </div>

        <button type="submit" class="btn-primary full-width">Iniciar Sesión</button>
      </form>

      <div class="divider"><span>o continúa con</span></div>

      <div class="social-login-group">
        <button class="btn-social google" onclick="loginSocial('Google')">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
          Google
        </button>
        <button class="btn-social microsoft" onclick="loginSocial('Microsoft')">
          <img src="https://www.svgrepo.com/show/448239/microsoft.svg" alt="Microsoft">
          Microsoft
        </button>
      </div>

      <p class="login-footer">
        ¿No tienes cuenta? <a href="#" onclick="alert('Funcionalidad de registro próximamente')">Regístrate gratis</a>
      </p>
    </div>
  </div>

  <!-- Vista 2: Aplicación Principal -->
  <div id="pantalla-app" class="app-container hidden">
    <header class="navbar">
      <div class="logo-brand clickable" onclick="irAlInicio()" title="Ir al inicio">
        <span class="brand-icon">🍽️</span>
        <span class="brand-name">Foodly</span>
      </div>

      <div class="nav-right">
        <button id="btn-theme" class="btn-theme-toggle" title="Cambiar tema">
          <span id="theme-icon">🌙</span>
        </button>
        <div class="user-location">
          📍 <span>Bello, Antioquia</span>
        </div>
        <button class="btn-logout" onclick="cerrarSesion()" title="Cerrar sesión">🚪 Exit</button>
      </div>
    </header>

    <main class="main-container">
      <section class="hero-section">
        <h1>¿Qué se te antoja hoy?</h1>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="buscador" placeholder="Buscar restaurante, plato o sabor...">
        </div>

        <div class="categorias-chips" id="contenedor-chips">
          <button class="chip active" data-categoria="Todos">✨ Todos</button>
          <button class="chip" data-categoria="Colombiana">🇨🇴 Colombiana</button>
          <button class="chip" data-categoria="Hamburguesas">🍔 Hamburguesas</button>
          <button class="chip" data-categoria="Parrilla">🥩 Parrilla</button>
          <button class="chip" data-categoria="Mexicana">🌮 Mexicana</button>
        </div>
      </section>

      <section class="feed-section">
        <h2 class="section-title">Restaurantes Destacados</h2>
        <div class="grid-restaurantes" id="contenedor-restaurantes">
          <!-- Tarjetas del feed dinámicas -->
        </div>
      </section>
    </main>
  </div>

  <!-- Modal Detalle Completo del Restaurante -->
  <div class="modal-overlay" id="modal-detalle">
    <div class="modal-card">
      <button class="btn-cerrar" id="btn-cerrar-modal">&times;</button>
      <div id="modal-contenido">
        <!-- Relleno por JS con la tarjeta detallada -->
      </div>
    </div>
  </div>

  <!-- Modal de Comentarios -->
  <div class="modal-overlay" id="modal-comentarios">
    <div class="modal-card small">
      <button class="btn-cerrar" onclick="cerrarModalComentarios()">&times;</button>
      <div class="modal-body">
        <h3 id="comentarios-titulo">Comentarios</h3>
        <div id="lista-comentarios" class="lista-comentarios"></div>
        <div class="input-comentario-box">
          <input type="text" id="input-nuevo-comentario" placeholder="Escribe un comentario...">
          <button class="btn-primary" onclick="agregarComentario()">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
